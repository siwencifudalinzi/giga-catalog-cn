name: Deploy catalog

on:
  push:
  workflow_run:
    workflows: ["Refresh catalog"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: catalog-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       !endsWith(github.actor, '[bot]')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete test suites
        run: python -m unittest discover -s tests/python -v && npm run test:js

      - name: Prepare release manifest
        run: python scripts/release.py prepare --source-commit "$(git rev-parse HEAD)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              | jq -e --arg id "$ARTIFACT_ID" 'any(.artifacts[]; (.id | tostring) == $id and .expired == false)' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_ID is unavailable for run $GITHUB_RUN_ID"
          exit 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

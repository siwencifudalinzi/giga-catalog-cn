<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <title>SPSF-66 · 站内播放 · GIGA Catalog</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://streamtape.com">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #10131b; color: #edf2fa; font-family: system-ui, sans-serif; line-height: 1.6; }
      main { width: min(100% - 32px, 1100px); margin: 24px auto; }
      a { color: #a9caff; text-underline-offset: 3px; }
      a:focus-visible { outline: 2px solid #a9caff; outline-offset: 5px; }
      h1 { margin: 24px 0 0; font-size: clamp(24px, 5vw, 36px); }
      .source { margin: 0 0 20px; color: #aab5c7; }
      iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; border-radius: 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 20px 0; }
      .hint { color: #aab5c7; font-size: 14px; }
      #connection-status { min-height: 2em; }
    </style>
  </head>
  <body>
    <main>
      <a href="../">← 返回影片目录</a>
      <h1>SPSF-66</h1>
      <p class="source">站内播放 · Streamtape</p>
      <p id="connection-status" class="hint" role="status" aria-live="polite">播放器加载可能需要一些时间，请稍候。</p>
      <iframe
        id="player"
        title="SPSF-66 视频播放器"
        src="https://streamtape.com/e/XByjZOkOjliDemd"
        referrerpolicy="no-referrer"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
      ></iframe>
      <nav class="actions" aria-label="播放操作">
        <a id="retry" href="spsf-66.html" aria-controls="player">重新加载播放器</a>
        <a href="https://streamtape.com/v/XByjZOkOjliDemd" target="_blank" rel="noopener noreferrer">在来源站打开</a>
      </nav>
      <p class="hint">点按播放器中的播放按钮开始观看。加载失败时，可重新加载或在来源站打开。</p>
    </main>
    <script>
      const player = document.querySelector("#player");
      const retry = document.querySelector("#retry");
      const status = document.querySelector("#connection-status");
      const source = player.src;
      let slowTimer;

      function connecting() {
        clearTimeout(slowTimer);
        status.textContent = "正在连接播放来源，请稍候…";
        slowTimer = setTimeout(() => {
          status.textContent = "来源站响应较慢，可以继续等待，或点下方重新加载播放器。";
        }, 15000);
      }

      player.addEventListener("load", () => {
        clearTimeout(slowTimer);
        // A cross-origin frame load does not prove that the video is playable.
        status.textContent = "若播放器已显示，请点按播放；仍为空白时可重新加载或在来源站打开。";
      });
      retry.addEventListener("click", event => {
        if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        connecting();
        player.src = source;
      });
      connecting();
    </script>
  </body>
</html>
